[build-system]
requires = ["flit_core >=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "reportm"
version = "0.1.0"
description = "CLI that turns a MuseumPlus object group into a multipage PDF report with metadata and photos"
authors = [{name = "Maurice Mengel", email = "mauricemengel@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
keywords = ["museum", "museumplus", "mpapi", "report", "pdf", "cli"]
requires-python = ">=3.11"
dependencies = [
    "lxml >=4.8.0",
    "requests >=2.6",
    "Pillow >=9.0",
    "reportlab >=4.0",
    "MpApi @ git+https://github.com/mokko/MpApi.git",
]

[project.optional-dependencies]
test = [
    "pytest >=7.0",
    "pypdf >=4.0",
]

[project.scripts]
reportm = "reportm.cli:main"

[tool.flit.module]
# The package directory is src/reportm; flit otherwise derives it from the
# project name, which it capitalizes — see the same note in MpApi's pyproject.
name = "reportm"

[tool.flit.sdist]
include = ["src/reportm/__init__.py"]
